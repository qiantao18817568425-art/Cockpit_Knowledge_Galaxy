name: Update public knowledge graph

on:
  workflow_dispatch:
  schedule:
    - cron: '35 1 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read public architecture site source
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/qiantao18817568425-art/Architecture_Learning-.git upstream
          git -C upstream sparse-checkout set docs/index.html docs/architecture docs/lessons content/learning-progress.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild graph index
        run: node scripts/build-graph.mjs --source upstream
      - name: Verify public nodes and edges
        run: node --test tests/graph.test.mjs
      - name: Commit content changes
        run: |
          if git diff --quiet -- docs/graph.json; then
            echo 'No public content changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/graph.json
          git commit -m 'Update public cockpit knowledge graph'
          git push

