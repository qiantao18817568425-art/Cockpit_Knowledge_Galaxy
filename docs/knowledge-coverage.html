<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识覆盖报告 · 座舱知识银河</title><style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:#07101f;color:#eaf2ff}main{width:min(1100px,calc(100% - 32px));margin:32px auto 70px}a{color:#8dceff}h1{margin-bottom:6px}.lead{color:#aebed7;line-height:1.7}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:24px 0}.card,.panel{border:1px solid #354d72;border-radius:10px;background:#0d1a2f;padding:16px}.card strong{display:block;color:#8ed3ff;font-size:28px}.card span{color:#aebed7;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.bar{display:flex;align-items:center;gap:9px;margin:8px 0}.bar b{width:125px;font-size:12px}.bar i{height:8px;border-radius:9px;background:linear-gradient(90deg,#73c9ff,#a88cff)}.bar span{margin-left:auto;color:#aebed7;font-size:11px}.queue{max-height:360px;overflow:auto}.queue div{padding:8px 0;border-bottom:1px solid #263958;color:#bdcce3;font-size:11px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><main><a href="index.html">← 返回知识银河</a><h1>知识覆盖报告</h1><p class="lead">这里公开显示资料处理和知识映射范围。“已索引”表示正文可检索，并不自动等于现车事实；技术关系仍以平台、版本、证据状态和页码为边界。</p><section class="cards" id="cards"></section><section class="grid"><div class="panel"><h2>资料分类</h2><div id="categories"></div></div><div class="panel"><h2>平台范围</h2><div id="platforms"></div></div><div class="panel"><h2>处理状态</h2><div id="states"></div></div><div class="panel queue"><h2>视觉核对队列</h2><div id="queue"></div></div></section></main><script type="module">
const r=await (await fetch('./source-register.json',{cache:'no-cache'})).json();const counts=(key)=>r.documents.reduce((m,x)=>(m[x[key]||'unspecified']=(m[x[key]||'unspecified']||0)+1,m),{});const cards=[['公开去重资料',r.summary.publicDocuments],['已映射资料',r.summary.mappedDocuments],['压缩包成员',r.summary.archiveDocuments],['视觉核对',r.documents.filter(x=>x.processingState==='needs_visual_review').length+r.archiveDocuments.filter(x=>x.processingState==='needs_visual_review').length]];document.querySelector('#cards').innerHTML=cards.map(x=>`<div class="card"><strong>${x[1]}</strong><span>${x[0]}</span></div>`).join('');function bars(id,data){const max=Math.max(...Object.values(data));document.querySelector(id).innerHTML=Object.entries(data).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><b>${k}</b><i style="width:${v/max*55}%"></i><span>${v}</span></div>`).join('')}bars('#categories',counts('category'));bars('#platforms',counts('platform'));bars('#states',counts('processingState'));const queue=[...r.documents.filter(x=>x.processingState==='needs_visual_review').map(x=>x.name),...r.archiveDocuments.filter(x=>x.processingState==='needs_visual_review').map(x=>`${x.containerName} / ${x.memberName}`)];document.querySelector('#queue').innerHTML=queue.length?queue.map(x=>`<div>${x}</div>`).join(''):'<div>顶层公开资料暂无待视觉核对项；压缩包成员状态见本列表。</div>';
</script></body></html>
